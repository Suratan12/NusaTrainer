name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Buat rilis dengan versi ini, mis. 1.0.0 (kosongkan untuk build biasa)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validasi database
        run: dotnet run --project tools/DbTool -- validate --db database

      - name: Test (termasuk uji integrasi dengan DemoGame)
        run: |
          dotnet build tools/DemoGame
          dotnet test tests/NusaTrainer.Core.Tests

      - name: Tentukan versi
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          release=false
          if [[ -n "$INPUT_VERSION" ]]; then
            v="${INPUT_VERSION#v}"; release=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; release=true
          else
            v="1.0.0"
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versi '$v' tidak valid. Gunakan format 1.2.3"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Publish win-x64
        run: >
          dotnet publish src/NusaTrainer.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }} -o publish/NusaTrainer

      - name: Publish DemoGame (untuk mencoba trainer)
        run: >
          dotnet publish tools/DemoGame -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=true -o publish/NusaTrainer/DemoGame

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $name = "NusaTrainer-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/NusaTrainer/* -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: NusaTrainer-win-x64
          path: ${{ steps.zip.outputs.name }}

      - name: Buat / perbarui GitHub Release
        if: steps.ver.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP: ${{ steps.zip.outputs.name }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          tag="v${VERSION}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${ZIP}"
          cat > release-notes.md <<NOTES
          ## Unduh
          **${ZIP}** — ekstrak, lalu jalankan \`NusaTrainer.exe\` (meminta hak Administrator).
          Untuk mencoba tanpa game sungguhan, jalankan \`DemoGame\\DemoGame.exe\`.

          SHA-256: \`${SHA256}\`

          ## Untuk pengelola
          Agar aplikasi yang sudah terpasang menawarkan pembaruan otomatis ke versi ini, salin ke \`database/app-release.json\` lalu push ke main:

          \`\`\`json
          {
            "version": "${VERSION}",
            "downloadUrl": "${url}",
            "sha256": "${SHA256}",
            "notes": "Ringkasan perubahan di sini."
          }
          \`\`\`
          NOTES
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP" --clobber
          else
            gh release create "$tag" "$ZIP" --target "$GITHUB_SHA" --title "NusaTrainer ${VERSION}" --notes-file release-notes.md
          fi
